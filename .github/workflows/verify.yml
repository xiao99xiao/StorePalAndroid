name: Verify SDK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build, lint, test, and stage Maven artifacts
        run: ./gradlew :storepal-core:test :storepal-android:testDebugUnitTest :storepal-android:lintDebug :sample:assembleDebug :storepal-android:assembleRelease :storepal-core:publishReleasePublicationToStorePalRepository :storepal-android:publishReleasePublicationToStorePalRepository --max-workers=2 --console=plain
      - name: Check immutable Maven publication
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: ./gradlew :storepal-android:connectedDebugAndroidTest --max-workers=2 --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdk-results
          path: |
            storepal-core/build/reports/
            storepal-android/build/reports/
            storepal-android/build/outputs/androidTest-results/
            storepal-android/build/outputs/aar/
            sample/build/outputs/apk/debug/
            build/maven-repository/
